name: Gate Attestation

on:
  pull_request:
    branches: [main]

# WHY: the reusable declares `contents: read` for its own job, but the caller
# controls the token the reusable receives. Declaring it here keeps the grant
# explicit at the boundary that actually decides it.
permissions:
  contents: read

# WHY: the reusable declares no concurrency group, so without this a rapid
# re-push leaves the superseded run to completion against a SHA nothing checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call:
    # WHY @main, not a pinned SHA: forkwright/.github publishes no tags, so a
    # SHA pin here has no dependabot bump path and just freezes -- this file
    # sat on d74efb1d, the same frozen revision akroasis/epistole/sphragis/
    # hamma/heurema all carried, predating a fix for a race in hybrid-gate.yml
    # itself. forkwright/.github is first-party -- same org, same trust
    # boundary -- not the third-party supply-chain case a SHA pin defends
    # against.
    uses: forkwright/.github/.github/workflows/gate-attestation.yml@main
